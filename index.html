<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack Pro - Musculation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .timer-active { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { color: #3b82f6; } 50% { color: #93c5fd; } 100% { color: #3b82f6; } }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <!-- Navigation -->
    <nav class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">F</div>
            <h1 class="text-xl font-bold tracking-tight">FitTrack <span class="text-blue-500 italic">Pro</span></h1>
        </div>
        <div class="flex gap-4 items-center">
            <div id="rest-timer-display" class="hidden text-sm font-mono font-bold bg-slate-800 px-3 py-1 rounded-full border border-blue-500/50">
                Repos: <span id="timer-seconds">90</span>s
            </div>
            <button onclick="switchTab('dashboard')" class="text-sm font-medium hover:text-blue-400 transition">Stats</button>
            <button onclick="switchTab('workout')" class="bg-blue-600 px-4 py-2 rounded-full text-sm font-bold hover:bg-blue-500 transition">+ Séance</button>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Dashboard Tab -->
        <section id="tab-dashboard" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass-card p-6 rounded-2xl">
                    <p class="text-slate-400 text-xs uppercase font-bold mb-1">Total Séances</p>
                    <h3 id="stat-total-workouts" class="text-3xl font-bold">0</h3>
                </div>
                <div class="glass-card p-6 rounded-2xl">
                    <p class="text-slate-400 text-xs uppercase font-bold mb-1">Volume Hebdo</p>
                    <h3 id="stat-weekly-volume" class="text-3xl font-bold">0 <span class="text-sm font-normal text-slate-500">kg</span></h3>
                </div>
                <div class="glass-card p-6 rounded-2xl">
                    <p class="text-slate-400 text-xs uppercase font-bold mb-1">Dernière Séance</p>
                    <h3 id="stat-last-session" class="text-lg font-semibold mt-2 text-blue-400">Aucune</h3>
                </div>
            </div>

            <!-- Routines / Modèles -->
            <div class="space-y-4">
                <h3 class="text-lg font-bold">Mes Routines</h3>
                <div id="routines-list" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <!-- Les routines s'afficheront ici -->
                </div>
            </div>

            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-lg font-bold mb-4">Progression (Volume)</h3>
                <div class="h-64">
                    <canvas id="progressionChart"></canvas>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-lg font-bold">Historique Récent</h3>
                <div id="history-list" class="space-y-3">
                    <p class="text-slate-500 italic text-center py-10">Commencez par ajouter votre première séance !</p>
                </div>
            </div>
        </section>

        <!-- Workout Tab -->
        <section id="tab-workout" class="hidden space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold">Nouvelle Séance</h2>
                <div class="flex gap-2">
                    <button onclick="saveAsRoutine()" class="text-xs bg-slate-800 px-3 py-1 rounded-lg hover:bg-slate-700">Sauver en Routine</button>
                    <button onclick="switchTab('dashboard')" class="text-slate-400 hover:text-white">Annuler</button>
                </div>
            </div>

            <div class="glass-card p-6 rounded-2xl space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Nom de la séance</label>
                    <input type="text" id="workout-name" placeholder="Ex: Push Day, Séance A..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div id="exercises-container" class="space-y-4">
                <!-- Les exercices seront ajoutés dynamiquement -->
            </div>

            <button onclick="addExerciseField()" class="w-full py-4 border-2 border-dashed border-slate-700 rounded-2xl text-slate-400 hover:border-blue-500 hover:text-blue-400 transition">
                + Ajouter un exercice
            </button>

            <button onclick="saveWorkout()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-lg hover:bg-blue-500 transition shadow-lg shadow-blue-900/20">
                Terminer la séance
            </button>
        </section>
    </main>

    <!-- Templates -->
    <template id="exercise-template">
        <div class="exercise-card glass-card p-6 rounded-2xl relative animate-in fade-in duration-300">
            <div class="flex justify-between items-start mb-4">
                <div class="flex-grow mr-4">
                    <input type="text" placeholder="Nom de l'exercice" class="exercise-name w-full bg-transparent text-lg font-bold border-b border-slate-700 focus:border-blue-500 outline-none pb-1">
                </div>
                <button onclick="this.closest('.exercise-card').remove()" class="text-red-400 hover:text-red-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] text-slate-500 uppercase tracking-wider">
                            <th class="py-2 pr-2">Set</th>
                            <th class="py-2 px-2">Kg</th>
                            <th class="py-2 px-2">Reps</th>
                            <th class="py-2 px-2">RPE</th>
                            <th class="py-2 px-2 text-right">Est. 1RM</th>
                            <th class="py-2 pl-4">OK</th>
                        </tr>
                    </thead>
                    <tbody class="sets-body">
                        <!-- Séries -->
                    </tbody>
                </table>
            </div>
            <button onclick="addSetField(this)" class="mt-4 text-sm text-blue-400 font-medium hover:underline">+ Ajouter une série</button>
        </div>
    </template>

    <script>
        // State
        let workouts = JSON.parse(localStorage.getItem('fittrack_workouts')) || [];
        let routines = JSON.parse(localStorage.getItem('fittrack_routines')) || [];
        let chart = null;
        let timerInterval = null;
        let remainingTime = 0;

        window.onload = () => {
            updateDashboard();
            initChart();
        };

        function switchTab(tabId) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tabId !== 'dashboard');
            document.getElementById('tab-workout').classList.toggle('hidden', tabId !== 'workout');
            if(tabId === 'workout') {
                if(document.getElementById('exercises-container').children.length === 0) {
                    addExerciseField();
                }
            } else {
                updateDashboard();
            }
        }

        // --- GESTION DES EXERCICES ET SÉRIES ---

        function addExerciseField(name = "") {
            const container = document.getElementById('exercises-container');
            const template = document.getElementById('exercise-template');
            const clone = template.content.cloneNode(true);
            const card = clone.querySelector('.exercise-card');
            if(name) card.querySelector('.exercise-name').value = name;
            container.appendChild(clone);
            
            if(!name) addSetField(container.lastElementChild.querySelector('button'));
        }

        function addSetField(btn, weight = 0, reps = 0, rpe = 10) {
            const tbody = btn.closest('.exercise-card').querySelector('.sets-body');
            const setNum = tbody.children.length + 1;
            const tr = document.createElement('tr');
            tr.className = "border-t border-slate-800 group";
            tr.innerHTML = `
                <td class="py-3 pr-2 font-medium text-slate-400">${setNum}</td>
                <td class="py-3 px-2">
                    <input type="number" oninput="calculate1RM(this)" class="set-weight w-14 bg-slate-800 rounded-lg p-2 text-center outline-none focus:ring-1 focus:ring-blue-500" value="${weight}">
                </td>
                <td class="py-3 px-2">
                    <input type="number" oninput="calculate1RM(this)" class="set-reps w-14 bg-slate-800 rounded-lg p-2 text-center outline-none focus:ring-1 focus:ring-blue-500" value="${reps}">
                </td>
                <td class="py-3 px-2">
                    <select class="set-rpe w-16 bg-slate-800 rounded-lg p-2 outline-none focus:ring-1 focus:ring-blue-500">
                        ${[10,9,8,7,6,5].map(v => `<option value="${v}" ${v==rpe?'selected':''}>${v}</option>`).join('')}
                    </select>
                </td>
                <td class="py-3 px-2 text-right text-xs text-slate-500 font-mono">
                    <span class="rm-display">-</span>
                </td>
                <td class="py-3 pl-4">
                    <button onclick="completeSet(this)" class="w-8 h-8 rounded-full border-2 border-slate-700 flex items-center justify-center text-slate-700 hover:border-green-500 hover:text-green-500 transition">
                        ✓
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
            if(weight > 0) calculate1RM(tr.querySelector('.set-weight'));
        }

        // --- FONCTIONNALITÉ 1: CHRONOMÈTRE DE REPOS ---

        function completeSet(btn) {
            const isDone = btn.classList.contains('bg-green-500');
            if(!isDone) {
                btn.className = "w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white border-2 border-green-500";
                startRestTimer(90); // 90 secondes par défaut
            } else {
                btn.className = "w-8 h-8 rounded-full border-2 border-slate-700 flex items-center justify-center text-slate-700 hover:border-green-500 hover:text-green-500 transition";
            }
        }

        function startRestTimer(seconds) {
            clearInterval(timerInterval);
            const display = document.getElementById('rest-timer-display');
            const text = document.getElementById('timer-seconds');
            display.classList.remove('hidden');
            display.classList.add('timer-active');
            
            remainingTime = seconds;
            text.innerText = remainingTime;

            timerInterval = setInterval(() => {
                remainingTime--;
                text.innerText = remainingTime;
                if(remainingTime <= 0) {
                    clearInterval(timerInterval);
                    display.classList.remove('timer-active');
                    // Petit signal visuel de fin
                    text.innerText = "FINI !";
                    setTimeout(() => display.classList.add('hidden'), 5000);
                }
            }, 1000);
        }

        // --- FONCTIONNALITÉ 2: CALCUL DU 1RM (EPLEY) ---

        function calculate1RM(input) {
            const row = input.closest('tr');
            const weight = parseFloat(row.querySelector('.set-weight').value) || 0;
            const reps = parseInt(row.querySelector('.set-reps').value) || 0;
            const display = row.querySelector('.rm-display');

            if(weight > 0 && reps > 0) {
                if(reps === 1) {
                    display.innerText = weight + " kg";
                } else {
                    // Formule d'Epley: 1RM = Poids * (1 + 0.0333 * Reps)
                    const rm = weight * (1 + 0.0333 * reps);
                    display.innerText = Math.round(rm) + " kg";
                }
            } else {
                display.innerText = "-";
            }
        }

        // --- FONCTIONNALITÉ 3: GESTION DES ROUTINES ---

        function saveAsRoutine() {
            const name = document.getElementById('workout-name').value;
            if(!name) return showToast("Donnez un nom à votre routine");

            const exercises = Array.from(document.querySelectorAll('.exercise-card')).map(card => {
                return card.querySelector('.exercise-name').value;
            }).filter(n => n !== "");

            if(exercises.length === 0) return showToast("Ajoutez des exercices");

            const routine = { name, exercises };
            routines.push(routine);
            localStorage.setItem('fittrack_routines', JSON.stringify(routines));
            showToast("Routine '" + name + "' enregistrée !");
            updateDashboard();
        }

        function loadRoutine(index) {
            const routine = routines[index];
            switchTab('workout');
            document.getElementById('workout-name').value = routine.name;
            document.getElementById('exercises-container').innerHTML = '';
            routine.exercises.forEach(exName => addExerciseField(exName));
        }

        function deleteRoutine(index, e) {
            e.stopPropagation();
            routines.splice(index, 1);
            localStorage.setItem('fittrack_routines', JSON.stringify(routines));
            updateDashboard();
        }

        // --- CORE LOGIC ---

        function saveWorkout() {
            const name = document.getElementById('workout-name').value || "Séance sans titre";
            const exerciseCards = document.querySelectorAll('.exercise-card');
            
            const workoutData = {
                id: Date.now(),
                date: new Date().toISOString(),
                name: name,
                exercises: []
            };

            exerciseCards.forEach(card => {
                const exName = card.querySelector('.exercise-name').value;
                if (!exName) return;

                const sets = Array.from(card.querySelectorAll('.sets-body tr')).map(row => ({
                    weight: parseFloat(row.querySelector('.set-weight').value) || 0,
                    reps: parseInt(row.querySelector('.set-reps').value) || 0,
                    rpe: parseInt(row.querySelector('.set-rpe').value) || 10
                }));

                workoutData.exercises.push({ name: exName, sets: sets });
            });

            workouts.unshift(workoutData);
            localStorage.setItem('fittrack_workouts', JSON.stringify(workouts));
            switchTab('dashboard');
            showToast("Séance enregistrée ! Bravo !");
        }

        function updateDashboard() {
            document.getElementById('stat-total-workouts').innerText = workouts.length;

            let weeklyVolume = 0;
            const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
            workouts.forEach(w => {
                if (new Date(w.date) > weekAgo) {
                    w.exercises.forEach(ex => ex.sets.forEach(s => weeklyVolume += (s.weight * s.reps)));
                }
            });
            document.getElementById('stat-weekly-volume').innerHTML = `${Math.round(weeklyVolume)} <span class="text-sm font-normal text-slate-500">kg</span>`;

            if (workouts.length > 0) {
                const last = workouts[0];
                document.getElementById('stat-last-session').innerText = `${last.name} (${new Date(last.date).toLocaleDateString()})`;
            }

            // Routines UI
            const rList = document.getElementById('routines-list');
            if(routines.length === 0) {
                rList.innerHTML = `<p class="col-span-full text-xs text-slate-600 italic">Aucune routine. Sauvegardez une séance pour la retrouver ici.</p>`;
            } else {
                rList.innerHTML = routines.map((r, i) => `
                    <div onclick="loadRoutine(${i})" class="glass-card p-3 rounded-xl border-blue-500/20 hover:border-blue-500 transition cursor-pointer group relative">
                        <button onclick="deleteRoutine(${i}, event)" class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 text-red-500 p-1 text-[10px]">✕</button>
                        <p class="text-xs font-bold truncate">${r.name}</p>
                        <p class="text-[10px] text-slate-500">${r.exercises.length} exos</p>
                    </div>
                `).join('');
            }

            // History UI
            const hList = document.getElementById('history-list');
            hList.innerHTML = workouts.slice(0, 5).map(w => `
                <div class="glass-card p-4 rounded-xl flex justify-between items-center group hover:bg-slate-800 transition cursor-pointer">
                    <div>
                        <h4 class="font-bold">${w.name}</h4>
                        <p class="text-xs text-slate-500">${new Date(w.date).toLocaleDateString()}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-blue-400">${w.exercises.length} exercices</p>
                        <button onclick="deleteWorkout(${w.id})" class="text-[10px] text-red-500 opacity-0 group-hover:opacity-100 transition">Supprimer</button>
                    </div>
                </div>
            `).join('');

            updateChart();
        }

        function deleteWorkout(id) {
            workouts = workouts.filter(w => w.id !== id);
            localStorage.setItem('fittrack_workouts', JSON.stringify(workouts));
            updateDashboard();
        }

        function initChart() {
            const ctx = document.getElementById('progressionChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Volume (kg)', data: [], borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { ticks: { color: '#64748b' }, grid: { display: false } } } }
            });
            updateChart();
        }

        function updateChart() {
            if (!chart) return;
            const history = [...workouts].reverse().slice(-10);
            chart.data.labels = history.map(w => new Date(w.date).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}));
            chart.data.datasets[0].data = history.map(w => {
                let vol = 0;
                w.exercises.forEach(ex => ex.sets.forEach(s => vol += (s.weight * s.reps)));
                return vol;
            });
            chart.update();
        }

        function showToast(msg) {
            const div = document.createElement('div');
            div.className = "fixed bottom-24 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-6 py-3 rounded-full shadow-2xl z-50 animate-bounce";
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }
    </script>
</body>
</html>
