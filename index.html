<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Suivi de Musculation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">F</div>
            <h1 class="text-xl font-bold tracking-tight">FitTrack</h1>
        </div>
        <div class="flex gap-4">
            <button onclick="switchTab('dashboard')" class="text-sm font-medium hover:text-blue-400 transition">Tableau de bord</button>
            <button onclick="switchTab('workout')" class="bg-blue-600 px-4 py-2 rounded-full text-sm font-bold hover:bg-blue-500 transition">+ Séance</button>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Dashboard Tab -->
        <section id="tab-dashboard" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass-card p-6 rounded-2xl">
                    <p class="text-slate-400 text-xs uppercase font-bold mb-1">Total Séances</p>
                    <h3 id="stat-total-workouts" class="text-3xl font-bold">0</h3>
                </div>
                <div class="glass-card p-6 rounded-2xl">
                    <p class="text-slate-400 text-xs uppercase font-bold mb-1">Volume Hebdo</p>
                    <h3 id="stat-weekly-volume" class="text-3xl font-bold">0 <span class="text-sm font-normal text-slate-500">kg</span></h3>
                </div>
                <div class="glass-card p-6 rounded-2xl">
                    <p class="text-slate-400 text-xs uppercase font-bold mb-1">Dernière Séance</p>
                    <h3 id="stat-last-session" class="text-lg font-semibold mt-2 text-blue-400">Aucune</h3>
                </div>
            </div>

            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-lg font-bold mb-4">Progression (Charge Max)</h3>
                <div class="h-64">
                    <canvas id="progressionChart"></canvas>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-lg font-bold">Historique Récent</h3>
                <div id="history-list" class="space-y-3">
                    <!-- Les séances s'afficheront ici -->
                    <p class="text-slate-500 italic text-center py-10">Commencez par ajouter votre première séance !</p>
                </div>
            </div>
        </section>

        <!-- Workout Tab (Add New) -->
        <section id="tab-workout" class="hidden space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold">Nouvelle Séance</h2>
                <button onclick="switchTab('dashboard')" class="text-slate-400 hover:text-white">Annuler</button>
            </div>

            <div class="glass-card p-6 rounded-2xl space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Nom de la séance (ex: Push Day)</label>
                    <input type="text" id="workout-name" placeholder="Pectoraux / Bras..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div id="exercises-container" class="space-y-4">
                <!-- Les exercices seront ajoutés dynamiquement -->
            </div>

            <button onclick="addExerciseField()" class="w-full py-4 border-2 border-dashed border-slate-700 rounded-2xl text-slate-400 hover:border-blue-500 hover:text-blue-400 transition">
                + Ajouter un exercice
            </button>

            <button onclick="saveWorkout()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-lg hover:bg-blue-500 transition shadow-lg shadow-blue-900/20">
                Enregistrer la séance
            </button>
        </section>
    </main>

    <!-- Templates -->
    <template id="exercise-template">
        <div class="exercise-card glass-card p-6 rounded-2xl relative animate-in fade-in duration-300">
            <div class="flex justify-between items-start mb-4">
                <div class="flex-grow mr-4">
                    <input type="text" placeholder="Nom de l'exercice" class="exercise-name w-full bg-transparent text-lg font-bold border-b border-slate-700 focus:border-blue-500 outline-none pb-1">
                </div>
                <button onclick="this.closest('.exercise-card').remove()" class="text-red-400 hover:text-red-300">Supprimer</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-xs text-slate-500 uppercase">
                            <th class="py-2 pr-2">Série</th>
                            <th class="py-2 px-2">Kg</th>
                            <th class="py-2 px-2">Reps</th>
                            <th class="py-2 px-2 text-center">RPE (1-10)</th>
                        </tr>
                    </thead>
                    <tbody class="sets-body">
                        <!-- Séries -->
                    </tbody>
                </table>
            </div>
            <button onclick="addSetField(this)" class="mt-4 text-sm text-blue-400 font-medium hover:underline">+ Ajouter une série</button>
        </div>
    </template>

    <script>
        // State Management
        let workouts = JSON.parse(localStorage.getItem('fittrack_workouts')) || [];
        let chart = null;

        window.onload = () => {
            updateDashboard();
            initChart();
        };

        function switchTab(tabId) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tabId !== 'dashboard');
            document.getElementById('tab-workout').classList.toggle('hidden', tabId !== 'workout');
            if(tabId === 'workout') {
                document.getElementById('exercises-container').innerHTML = '';
                addExerciseField();
            } else {
                updateDashboard();
            }
        }

        function addExerciseField() {
            const container = document.getElementById('exercises-container');
            const template = document.getElementById('exercise-template');
            const clone = template.content.cloneNode(true);
            container.appendChild(clone);
            
            // Ajouter une première série par défaut au dernier exercice ajouté
            const lastExercise = container.lastElementChild;
            addSetField(lastExercise.querySelector('button'));
        }

        function addSetField(btn) {
            const tbody = btn.closest('.exercise-card').querySelector('.sets-body');
            const setNum = tbody.children.length + 1;
            const tr = document.createElement('tr');
            tr.className = "border-t border-slate-800";
            tr.innerHTML = `
                <td class="py-3 pr-2 font-medium text-slate-400">${setNum}</td>
                <td class="py-3 px-2">
                    <input type="number" class="set-weight w-16 bg-slate-800 rounded-lg p-2 text-center outline-none focus:ring-1 focus:ring-blue-500" value="0">
                </td>
                <td class="py-3 px-2">
                    <input type="number" class="set-reps w-16 bg-slate-800 rounded-lg p-2 text-center outline-none focus:ring-1 focus:ring-blue-500" value="0">
                </td>
                <td class="py-3 px-2">
                    <select class="set-rpe w-full bg-slate-800 rounded-lg p-2 outline-none focus:ring-1 focus:ring-blue-500">
                        ${Array.from({length: 10}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('')}
                        <option value="10" selected>10</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function saveWorkout() {
            const name = document.getElementById('workout-name').value || "Séance sans titre";
            const exerciseCards = document.querySelectorAll('.exercise-card');
            
            if (exerciseCards.length === 0) return showToast("Ajoutez au moins un exercice");

            const workoutData = {
                id: Date.now(),
                date: new Date().toISOString(),
                name: name,
                exercises: []
            };

            exerciseCards.forEach(card => {
                const exName = card.querySelector('.exercise-name').value;
                if (!exName) return;

                const sets = [];
                card.querySelectorAll('.sets-body tr').forEach(row => {
                    sets.push({
                        weight: parseFloat(row.querySelector('.set-weight').value) || 0,
                        reps: parseInt(row.querySelector('.set-reps').value) || 0,
                        rpe: parseInt(row.querySelector('.set-rpe').value) || 10
                    });
                });

                workoutData.exercises.push({ name: exName, sets: sets });
            });

            workouts.unshift(workoutData);
            localStorage.setItem('fittrack_workouts', JSON.stringify(workouts));
            switchTab('dashboard');
        }

        function updateDashboard() {
            const totalWorkouts = workouts.length;
            document.getElementById('stat-total-workouts').innerText = totalWorkouts;

            // Calcul Volume (7 derniers jours)
            const weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            
            let weeklyVolume = 0;
            workouts.forEach(w => {
                if (new Date(w.date) > weekAgo) {
                    w.exercises.forEach(ex => {
                        ex.sets.forEach(s => weeklyVolume += (s.weight * s.reps));
                    });
                }
            });
            document.getElementById('stat-weekly-volume').innerHTML = `${Math.round(weeklyVolume)} <span class="text-sm font-normal text-slate-500">kg</span>`;

            // Dernier exercice
            if (workouts.length > 0) {
                const last = workouts[0];
                const d = new Date(last.date);
                document.getElementById('stat-last-session').innerText = `${last.name} (${d.toLocaleDateString()})`;
            }

            // Historique
            const list = document.getElementById('history-list');
            if (workouts.length === 0) {
                list.innerHTML = `<p class="text-slate-500 italic text-center py-10">Commencez par ajouter votre première séance !</p>`;
            } else {
                list.innerHTML = workouts.slice(0, 5).map(w => `
                    <div class="glass-card p-4 rounded-xl flex justify-between items-center group hover:bg-slate-800 transition cursor-pointer">
                        <div>
                            <h4 class="font-bold">${w.name}</h4>
                            <p class="text-xs text-slate-500">${new Date(w.date).toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-blue-400">${w.exercises.length} exercices</p>
                            <button onclick="deleteWorkout(${w.id})" class="text-[10px] text-red-500 opacity-0 group-hover:opacity-100 transition">Supprimer</button>
                        </div>
                    </div>
                `).join('');
            }

            updateChart();
        }

        function deleteWorkout(id) {
            workouts = workouts.filter(w => w.id !== id);
            localStorage.setItem('fittrack_workouts', JSON.stringify(workouts));
            updateDashboard();
        }

        function initChart() {
            const ctx = document.getElementById('progressionChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Volume total par séance (kg)',
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#3b82f6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function updateChart() {
            if (!chart) return;
            const history = [...workouts].reverse().slice(-10);
            chart.data.labels = history.map(w => new Date(w.date).toLocaleDateString('fr-FR', {day: '2-digit', month: '2-digit'}));
            chart.data.datasets[0].data = history.map(w => {
                let vol = 0;
                w.exercises.forEach(ex => ex.sets.forEach(s => vol += (s.weight * s.reps)));
                return vol;
            });
            chart.update();
        }

        function showToast(msg) {
            const div = document.createElement('div');
            div.className = "fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-full shadow-2xl z-50 animate-bounce";
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }
    </script>
</body>
</html>
